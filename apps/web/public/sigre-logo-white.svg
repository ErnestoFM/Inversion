<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <!-- Gradiente blanco-verde para la "S" en modo oscuro -->
    <linearGradient id="s-gradient-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <!-- Letra S con gradiente blanco-verde -->
  <text x="0" y="76" font-family="'Outfit', 'Poppins', sans-serif" font-size="80" font-weight="700" fill="url(#s-gradient-white)">S</text>

  <!-- Letras IGRE en blanco -->
  <text x="48" y="76" font-family="'Outfit', 'Poppins', sans-serif" font-size="80" font-weight="700" fill="#FFFFFF">IGRE</text>

  <!-- Barra decorativa verde claro -->
  <rect x="0" y="88" width="60" height="4" rx="2" fill="#4ADE80"/>
</svg>
